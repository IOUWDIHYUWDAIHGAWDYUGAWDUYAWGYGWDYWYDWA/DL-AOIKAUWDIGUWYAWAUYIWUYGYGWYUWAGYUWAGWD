# QBJBXSANFHKEMVNAOCLMBPVQ Bot — 7/24 ücretsiz barındırma (kredi kartı gerekmez)
#
# Nasıl çalışır:
#  - Public repo'daki GitHub Actions dakikaları ücretsizdir (sınırsız).
#  - Cron her 10 dakikada bir tetikler; "concurrency" sayesinde bir önceki
#    çalışma bitmeden yenisi BAŞLAMAZ, kuyrukta bekler. Böylece bot ~5.8 saatlik
#    job'lar halinde kesintisiz koşar (GitHub job limiti 6 saattir).
#  - Veritabanı repo'da HİÇ tutulmaz: her 5 dakikada bir denetlenir, veri
#    değiştiyse ŞİFRELENİP (AES-256, DB_KEY) SADECE Telegram'a yüklenir.
#    Repo'ya yalnızca son yedeğin file_id işaretçisi (.backup-ref.json) işlenir
#    — repoyu klonlayan biri veri görmez. Her run başında DB, Telegram'dan
#    indirilip çözülür (db-restore.js).
#  - Telegram komutları (/durum, /top, /uye, /loglar, /uyarilar) aynı bot
#    üzerinden veritabanını sorgular (db-telegram.js).
#
# Gerekli repo secret'ları: TOKEN, CLIENT_ID, GUILD_ID, DB_KEY, SOURCE_KEY,
# TELEGRAM_TOKEN, TELEGRAM_CHAT_ID (DB yedek/geri yükleme)
#
# 🔑 SOURCE_KEY: dist/**/*.js.enc dosyalarını çözen anahtar. Repo'da kaynak
# kod DÜZ METİN bulunmaz; bot start.js ile SOURCE_KEY kullanarak çözülür.
# Üret: node scripts/db-crypto.js keygen
#
# Kurulum: DEPLOY.md'deki "Kredi kartı gerektirmeyen" bölümüne bak.

name: QBJBXSANFHKEMVNAOCLMBPVQ Bot 24/7

on:
  # 🔑 KRİTİK: GitHub schedule run'ları, aynı workflow'un bir run'ı in_progress
  # iken ATLANIR (bu yüzden cron hiç tetiklenmiyordu). Bunun yerine push tetikleyicisi
  # kullanılır: botun her 5 dk'lık kalp atışı push'u (.backup-ref.json commit'i)
  # yeni bir run kuyruğa alır → mevcut run bitince (5.8 saat limiti / çökme /
  # kod değişimi) kuyruktaki run anında devralır.
  # Yani bot kendi kendini sürekli ayakta tutar; manuel/cron bağımlılığı yok.
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

concurrency:
  group: qbjbxsanfhkemvnaoclmbpvq
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      # Değerler repo Secrets'ından gelir; eksik olanlar config.json'a düşer.
      TOKEN: ${{ secrets.TOKEN }}
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      GUILD_ID: ${{ secrets.GUILD_ID }}
      REQUIRED_ROLE_ID: ${{ secrets.REQUIRED_ROLE_ID }}
      ADMIN_ROLE_IDS: ${{ secrets.ADMIN_ROLE_IDS }}
      ADMIN_USER_IDS: ${{ secrets.ADMIN_USER_IDS }}
      RANK_CONTROL_ROLE_ID: ${{ secrets.RANK_CONTROL_ROLE_ID }}
      FOUNDER_USER_IDS: ${{ secrets.FOUNDER_USER_IDS }}
      LOG_CHANNEL_ID: ${{ secrets.LOG_CHANNEL_ID }}
      STAY_VOICE_CHANNEL_ID: ${{ secrets.STAY_VOICE_CHANNEL_ID }}
      WARNING_ROLES: ${{ secrets.WARNING_ROLES }}
      BLACKLIST_ROLE_ID: ${{ secrets.BLACKLIST_ROLE_ID }}
      # 🔑 Tam sıfırlama (s!fırl@ma) şifresi — config.json'da DEĞİL, secret'ta durur
      RESET_PASSWORD: ${{ secrets.RESET_PASSWORD }}
      # 🔑 Kaynak kod şifreleme anahtarı (dist/*.js.enc → çözme)
      SOURCE_KEY: ${{ secrets.SOURCE_KEY }}
      # 🔑 Veritabanı şifreleme anahtarı (node scripts/db-crypto.js keygen ile üret)
      DB_KEY: ${{ secrets.DB_KEY }}
      # ☁️ Harici DB yedeği (Telegram) — repo'dan bağımsız ikinci kopya
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 🎙️ İkinci token: ses botu (stayVoiceChannelId kanalında durur)
      VOICE_TOKEN: ${{ secrets.VOICE_TOKEN }}
      # 🍪 YouTube çerezleri (opsiyonel) — GitHub IP'sinden "Sign in to confirm you're not a bot" engelini kaldırır
      YT_COOKIE: ${{ secrets.YT_COOKIE }}
      # 🕹️ Gizli DM kontrol paneli (kullanıcı + kod)
      OWNER_PANEL_USER_ID: ${{ secrets.OWNER_PANEL_USER_ID }}
      OWNER_PANEL_CODE: ${{ secrets.OWNER_PANEL_CODE }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci --omit=dev

      - name: 🎵 Müzik ortamı kurulumu (yt-dlp + ffmpeg)
        run: |
          # yt-dlp — YouTube 2026'da WEB istemcisine format URL'leri vermiyor;
          # yt-dlp android istemcisi GitHub IP'sinde bile çalışıyor.
          # (/usr/local/bin runner'da root'a ait — sudo gerekir; bot yoksa kendi indirir)
          curl -sL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /tmp/yt-dlp
          chmod +x /tmp/yt-dlp
          sudo install -m 755 /tmp/yt-dlp /usr/local/bin/yt-dlp
          yt-dlp --version
          # ffmpeg: runner imajlarında bazen eksik olabiliyor — garantiye al
          if ! command -v ffmpeg >/dev/null 2>&1; then
            echo "⚠️ ffmpeg yok, kuruluyor (apt)..."
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version 2>/dev/null | head -1 || echo "⚠️ ffmpeg hâlâ yok — ffmpeg-static paketi devrede"
          node -e "const f=require('ffmpeg-static'); console.log('✅ ffmpeg-static hazır:', f)"
          node -e "require('play-dl'); console.log('✅ play-dl yüklü ve erişilebilir')"
          echo "✅ yt-dlp hazır: $(yt-dlp --version)"

      - name: 🔐 Sızıntı taraması (token repo'ya sızmışsa dur)
        run: node scripts/check-secrets.js

      - name: Slash komutlarını eşitle
        run: node dist/start.js deploy-commands.js

      - name: Botu çalıştır + Telegram yedeği
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Runner checkout'u detached HEAD olabilir; main'e bağlan (yoksa push çalışmaz)
          git checkout -B main origin/main 2>/dev/null || true

          # 🔓 Veritabanını geri yükle — repo'da veri YOK, DB Telegram'da durur.
          # İlk çalıştırmada referans yoksa checkout'taki mevcut dist/data.db
          # kullanılır ve ilk 5 dk içinde Telegram'a yüklenir.
          # (Referans var ama geri yükleme başarısızsa run durur — boş DB ile
          # başlayıp iyi verinin üstüne yazmamak için.)
          node scripts/db-restore.js

          node dist/start.js &
          BOT_PID=$!
          echo "Bot başladı (PID $BOT_PID)"

          # 🔄 OTOMATİK YENİDEN BAŞLATMA: her 60 sn'de bir repo'da yeni kod var mı diye bak.
          # Varsa bot AYNI RUN İÇİNDE yeniden başlatılır (kuyruğa bağımlı değil → asla çevrimdışı kalmaz).
          # Yerel data.db korunur (en taze veri), sadece dist kodu güncellenir.
          # (Kalp atışı commit'leri dist/ dışındaki .backup-ref.json'a dokunduğu için restart tetiklemez.)
          # Yedek her 5 dakikada bir denetlenir, veri değiştiyse yüklenir.
          LAST_BACKUP=$SECONDS
          LAST_HEARTBEAT=$SECONDS
          while kill -0 $BOT_PID 2>/dev/null; do
            sleep 60

            git fetch origin main -q 2>/dev/null || true
            if ! git diff --quiet HEAD origin/main -- dist ':!dist/data.db' ':!dist/data.db.enc' 2>/dev/null; then
              echo "🔄 Yeni kod algılandı (${GITHUB_SHA:0:7} → $(git rev-parse --short origin/main 2>/dev/null || echo '?') ) — bot yeniden başlatılıyor..."
              kill $BOT_PID 2>/dev/null
              # wait 143 döner (SIGTERM); || true olmadan set -e script'i hata koduyla bitirir
              wait $BOT_PID 2>/dev/null || true
              # Yeni kodu çek; en taze veritabanını koru
              cp -f dist/data.db .db-fresh 2>/dev/null || true
              git reset --hard origin/main -q 2>/dev/null || true
              cp -f .db-fresh dist/data.db 2>/dev/null || true
              rm -f .db-fresh
              npm ci --omit=dev >/dev/null 2>&1 || true
              node dist/start.js &
              BOT_PID=$!
              LAST_BACKUP=$SECONDS
              echo "✅ Bot yeni kodla aynı run içinde yeniden başlatıldı (PID $BOT_PID)"
              continue
            fi

            # ☁️ Yedek her 5 dakikada bir denetlenir; veri değiştiyse SADECE
            # Telegram'a yüklenir (repo'ya asla veri düşmez). Yeni işaretçi varsa
            # hemen commit+push — run çökse bile işaretçi kaybolmaz.
            if [ $((SECONDS - LAST_BACKUP)) -ge 300 ]; then
              LAST_BACKUP=$SECONDS
              node scripts/db-backup.js || echo "⚠️ Telegram yedeği başarısız: $(date -u +%FT%TZ)"
              if [ -f .backup-ref.json ]; then
                git add .backup-ref.json
                if ! git diff --cached --quiet -- .backup-ref.json 2>/dev/null; then
                  git commit -m "bot: yedek referansı ($(date -u +%FT%TZ))" -q || true
                  git push origin HEAD:main -q 2>&1 || echo "⚠️ push başarısız: $(date -u +%FT%TZ)"
                fi
              fi
            fi

            # 🤖 Telegram komut servisi: /durum /top /uye /loglar /uyarilar
            # (kısa long-poll — komut varsa veritabanından cevap verir)
            node scripts/db-telegram.js || echo "⚠️ Telegram komut servisi hatası: $(date -u +%FT%TZ)"

            # 🔁 Kalp atışı (5 dk): repo'ya yalnızca işaretçi/boş commit işlenir.
            # Bu push, botu ayakta tutan tetikleyicidir — cron, run in_progress
            # iken atlanıyor; kuyruğa sürekli yeni run koyar.
            if [ $((SECONDS - LAST_HEARTBEAT)) -ge 300 ]; then
              LAST_HEARTBEAT=$SECONDS
              git add .backup-ref.json 2>/dev/null || true
              git commit -m "bot: kalp atışı ($(date -u +%FT%TZ))" --allow-empty -q || true
              git push origin HEAD:main -q 2>&1 || echo "⚠️ push başarısız: $(date -u +%FT%TZ)"
            fi
          done

          wait $BOT_PID
